# Rebuild Railway depuis GitHub (sans railway up = pas de timeout upload).
# Secret RAILWAY_TOKEN = token PROJET (projet → Settings → Tokens → production)
# Prérequis : rugtracker → Settings → Source → repo GitHub branché sur main
name: Deploy Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy from GitHub source
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Ajoute RAILWAY_TOKEN (token PROJET Railway, pas token compte)"
            exit 1
          fi
          railway redeploy --service rugtracker --yes --from-source
