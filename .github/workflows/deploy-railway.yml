# Déploie sur Railway à chaque push sur main.
# Secret : RAILWAY_TOKEN = token de PROJET (pas token compte !)
#   Railway → projet reasonable-healing → Settings → Tokens → Create (env: production)
name: Deploy Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Ajoute RAILWAY_TOKEN dans GitHub → Settings → Secrets → Actions"
            exit 1
          fi
          railway whoami || echo "::warning::whoami a échoué — vérifie que c'est un token PROJET"

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --detach --service rugtracker
