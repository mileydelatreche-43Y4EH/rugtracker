# Déclenche un rebuild Railway sans upload (évite le timeout backboard).
# Prérequis : repo GitHub branché sur le service rugtracker (Settings → Source).
# Secret : RAILWAY_TOKEN = token PROJET (projet reasonable-healing → Settings → Tokens)
name: Deploy Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Secret RAILWAY_TOKEN manquant (token PROJET Railway)"
            exit 1
          fi
          railway whoami

      - name: Redeploy service rugtracker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Build depuis GitHub (pas d'upload CLI)…"
          railway redeploy --service rugtracker --yes --from-source
